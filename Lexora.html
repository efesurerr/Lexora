<style>
/* Düzen: koyu, tek sütun, telefon odaklı. Cevaplar harf karoları olarak dizilir; satır uzadıkça cevap uzar. Vurgu mordan turkuaza giden LEXORA başlığında. */
:root {
  --bg: #101426;
  --bg2: #151B30;
  --surface: #1B2340;
  --purple: #8B5CF6;
  --purple2: #A78BFA;
  --cyan: #22D3EE;
  --ok: #34D399;
  --warn: #FBBF24;
  --bad: #F87171;
  --ink: #FFFFFF;
  --ink2: #A5B4FC;
  --muted: #64748B;
  --line: #303A59;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(48rem 22rem at 50% -6rem, rgba(139, 92, 246, .24), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
#app { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

/* Üst şerit */
.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 40px; }
.hudr { display: flex; gap: 8px; }
.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: .14em; color: var(--purple2); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink2);
  font-size: .85rem; font-weight: 600; cursor: pointer;
}
.chip svg { width: 16px; height: 16px; flex: none; }
.chip::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.chip[aria-pressed="true"]::after { background: var(--ok); }

.top { display: flex; justify-content: space-between; gap: 12px; font-size: .875rem; color: var(--ink2); font-weight: 500; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); font-weight: 600; }
.lead { color: var(--ink2); }
.muted { color: var(--ink2); }
.lab { font-weight: 600; font-size: .9rem; color: var(--ink2); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: .9rem; color: var(--ink2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card.center { text-align: center; padding-block: 36px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.cat { font-size: 2.1rem; line-height: 1.1; margin-top: 4px; }
.name { font-size: 2.5rem; line-height: 1.1; overflow-wrap: anywhere; }
.note { font-size: .875rem; color: var(--ink2); }
.note.ok { color: var(--ok); }
.note.bad { color: var(--bad); font-weight: 600; }

/* Harf karoları */
.word { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.word i {
  font-style: normal; display: grid; place-items: center;
  width: 1.9rem; height: 2.3rem; border-radius: 6px;
  background: var(--line); color: var(--ink);
  font-family: var(--f-display); font-weight: 800; font-size: 1.1rem;
}
.word b { width: .7rem; }
.word.win i { background: var(--ok); color: #07241A; }
.word.out i { background: transparent; border: 1.5px dashed var(--bad); color: var(--bad); }
.word.big i { width: 2.6rem; height: 3.1rem; font-size: 1.6rem; border-radius: 8px; }
.mark { display: flex; gap: 4px; margin: 6px 0 0; }
.mark i {
  font-style: normal; display: grid; place-items: center; flex: 1; max-width: 3.4rem; aspect-ratio: 3 / 3.6;
  border-radius: 10px; color: #101426; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 9vw, 2.3rem);
}

/* Menü düğmeleri ve formlar */
.menu {
  display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; min-height: 72px; padding: 14px 16px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.menu strong { font-family: var(--f-display); font-size: 1.2rem; }
.menu span { color: var(--ink2); font-size: .9rem; }
.menu.primary { background: var(--purple); border-color: var(--purple); }
.menu.primary span { color: #F1EAFF; }
.menu[aria-disabled="true"] { opacity: .55; cursor: default; }
.field {
  width: 100%; min-height: 54px; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 0 14px; font-size: 1.15rem; background: var(--bg2); color: var(--ink);
}
.prow { display: flex; gap: 8px; }
.prow .field { min-height: 50px; font-size: 1rem; }
.icon {
  min-width: 48px; min-height: 50px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 12px; font-size: 1.3rem; cursor: pointer;
}
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; min-height: 46px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--purple); color: var(--ink); border-color: var(--purple2); }
.btn {
  display: block; width: 100%; min-height: 56px; border: 0; border-radius: 12px;
  background: var(--purple); color: var(--ink); font-family: var(--f-display);
  font-weight: 800; font-size: 1.2rem; cursor: pointer;
}
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; font-size: 1.05rem; }
.link {
  background: none; border: 0; color: var(--cyan); font-weight: 600; font-size: .95rem;
  min-height: 44px; padding: 0 4px; cursor: pointer; text-decoration: underline;
}
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--warn); transform-origin: left; }
.bar.low > div { background: var(--bad); }
.bar.ok > div { background: var(--ok); }
details.card summary { font-weight: 600; cursor: pointer; min-height: 28px; }
details.card ol { margin: 10px 0 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; color: var(--ink2); }

/* Sonuç ve puan */
.res { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.res.won { border-color: var(--ok); }
.rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .9rem; }
.s-ok { color: var(--ok); font-weight: 600; }
.s-warn { color: var(--warn); font-weight: 600; }
.s-bad { color: var(--bad); font-weight: 600; }
.badge { background: var(--ok); color: #07241A; font-family: var(--f-display); font-weight: 800; border-radius: 999px; padding: 2px 12px; }
.tag { font-size: .75rem; color: var(--cyan); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
.verdict { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1.25; }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.board li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.board li:first-child { border-top: 0; }
.board .who { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.rank { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 6px; background: var(--line); font-family: var(--f-display); font-weight: 800; flex: none; }
.rank.first { background: var(--ok); color: #07241A; }
.pts { font-variant-numeric: tabular-nums; font-weight: 700; }
.pts em { font-style: normal; color: var(--ok); font-size: .85em; }
.codebox { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
</style>

    return hud(true) + '<h2>' + esc(t('joinroom')) + '</h2>' + msgHtml() +
      '<div class="stack"><label class="lab" for="oname">' + esc(t('yourname')) + '</label><input class="field" id="oname" maxlength="16" autocomplete="off" value="' + esc(PREF.oname) + '"></div>' +
      '<div class="stack"><label class="lab" for="ocode">' + esc(t('code')) + '</label><input class="field" id="ocode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(S.ocode) + '"></div>' +
      '<button type="button" class="btn" data-act="ojgo">' + esc(t('enter')) + '</button><button type="button" class="btn ghost" data-act="home">' + esc(t('back')) + '</button>';
  }
  function isHost() { return !!S.room && S.room.host === S.uid; }
  function findAns(round, uid) {
    for (var i = 0; i < S.ra.length; i++) { if (S.ra[i].round === round && S.ra[i].uid === uid) return S.ra[i]; }
    return null;
  }
  function countAns(round) {
    var n = 0;
    S.rp.forEach(function (p) { if (findAns(round, p.id)) n++; });
    return n;
  }
  function oEval(r) {
    var cat = cats()[S.room.order[r]];
    var ovr = S.room.ovr || {};
    return evalEntries(cat, S.rp.map(function (p) {
      var a = findAns(r, p.id);
      return { uid: p.id, name: p.name, raw: a ? String(a.raw || '').slice(0, 40) : '', ovr: ovr['r' + r + '_' + p.id] };
    }));
  }
  function oScores(upTo) {
    var sc = {};
    S.rp.forEach(function (p) { sc[p.id] = 0; });
    for (var r = 0; r <= upTo; r++) { oEval(r).rows.forEach(function (x) { if (x.win) sc[x.uid]++; }); }
    return sc;
  }
  function leaveBtn() { return '<button type="button" class="btn ghost" data-act="leave">' + esc(t('leave')) + '</button>'; }
  function onlineView() {
    var r = S.room;
    if (!r) return hud(true) + '<p class="lead" role="status">' + esc(t('loading')) + '</p>' + leaveBtn();
    if (r.status === 'lobby') return lobbyView();
    if (r.status === 'play') return (findAns(r.round, S.uid) || S.sent === r.round) ? waitView() : oInputView();
    if (r.status === 'reveal') return oRevealView();
    return oFinalView();
  }
  function lobbyView() {
    var r = S.room, host = isHost();
    var rows = S.rp.map(function (p) {
      return '<li><span class="who">' + esc(p.name) + (p.id === r.host ? '<span class="tag">' + esc(t('hosttag')) + '</span>' : '') + (p.id === S.uid ? '<span class="tag">' + esc(t('youtag')) + '</span>' : '') + '</span></li>';
    }).join('');
    return hud(true) + msgHtml() + '<section class="card codebox"><p class="eyebrow">' + esc(t('code')) + '</p>' + tiles(S.code, 'big win') +
      '<button type="button" class="link" data-act="copy">' + esc(t('copy')) + '</button>' +
      '<p class="note">' + esc(LNAME[r.lang]) + ' · ' + esc(t('rounds')) + ' ' + r.rounds + ' · ' + (r.time ? r.time + ' ' + esc(t('sec')) : esc(t('nolimit'))) + '</p></section>' +
      '<section class="card"><h3 class="lab">' + esc(t('lobby')) + ' (' + S.rp.length + ' / 6)</h3><ul class="board">' + rows + '</ul></section>' +
      (host ? '<button type="button" class="btn" data-act="ostart"' + (S.rp.length < 2 ? ' disabled' : '') + '>' + esc(t('startgame')) + '</button>' +
        (S.rp.length < 2 ? '<p class="note">' + esc(t('need2')) + '</p>' : '') : '<p class="note" role="status">' + esc(t('waithost')) + '</p>') + leaveBtn();
  }
  function oInputView() {
    var r = S.room;
    return hud(true) + msgHtml() + '<div class="top"><span>' + esc(t('round', { a: r.round + 1, b: r.rounds })) + '</span><span>' + esc(t('nplayers', { n: S.rp.length })) + '</span></div>' +
      inputBlock(cats()[r.order[r.round]], cleanName(PREF.oname) || t('pl'));
  }
  function waitView() {
    var r = S.room, a = countAns(r.round), b = S.rp.length;
    return hud(true) + msgHtml() + '<div class="top"><span>' + esc(t('round', { a: r.round + 1, b: r.rounds })) + '</span><span>' + esc(cats()[r.order[r.round]].n) + '</span></div>' +
      '<section class="card center"><h2>' + esc(t('sent')) + '</h2><p class="muted" role="status">' + esc(t('waitfor', { a: a, b: b })) + '</p></section>' +
      '<div class="bar ok"><div style="transform:scaleX(' + (b ? a / b : 0) + ')"></div></div>' +
      (isHost() ? '<button type="button" class="btn ghost" data-act="oforce">' + esc(t('forcereveal')) + '</button>' : '') + leaveBtn();
  }
  function oRevealView() {
    var r = S.room, host = isHost(), res = oEval(r.round), sc = oScores(r.round), last = r.round + 1 >= r.rounds;
    var list = S.rp.map(function (p) {
      var row = res.rows.filter(function (x) { return x.uid === p.id; })[0];
      return { name: p.name, score: sc[p.id], add: !!(row && row.win) };
    }).sort(function (a, b) { return b.score - a.score; });
    return hud(true) + msgHtml() + '<div class="top"><span>' + esc(t('round', { a: r.round + 1, b: r.rounds })) + '</span><span>' + esc(cats()[r.order[r.round]].n) + '</span></div>' +
      '<p class="verdict">' + verdictText(res) + '</p><section class="stack">' + resultCards(res, host ? 'otoggle' : '') + '</section>' +
      '<section class="card"><h3 class="lab">' + esc(t('board')) + '</h3>' + boardHtml(list) + '</section>' +
      (host ? '<button type="button" class="btn" data-act="onext">' + esc(last ? t('seeres') : t('nextr')) + '</button>' : '<p class="note" role="status">' + esc(t('hostnext')) + '</p>') + leaveBtn();
  }
  function oFinalView() {
    var r = S.room, sc = oScores(r.rounds - 1);
    return hud(true) + finalHtml(S.rp.map(function (p) { return { name: p.name, score: sc[p.id] }; })) +
      '<button type="button" class="btn" data-act="leave">' + esc(t('home')) + '</button>';
  }

  /* ---------- Çizim ---------- */
  function render(keepScroll) {
    stopTimer();
    var views = { home: homeView, setup: setupView, pass: passView, input: inputView, reveal: revealView, final: finalView, ocreate: ocreateView, ojoin: ojoinView, online: onlineView };
    var html = views[S.screen]();
    S.msg = '';
    document.documentElement.lang = S.lang;
    app.innerHTML = html;
    if (!keepScroll) window.scrollTo(0, 0);
    var a = document.getElementById('ans');
    if (a) {
      try { a.focus({ preventScroll: true }); } catch (e) { a.focus(); }
      if (curTime()) startTimer(curTime());
    }
  }
  var app = document.getElementById('app');

  /* ---------- Yerel oyun akışı ---------- */
  function syncInputs() {
    var els = document.querySelectorAll('.pname');
    if (els.length) S.names = [].map.call(els, function (e) { return e.value; });
    var on = document.getElementById('oname');
    if (on) PREF.oname = cleanName(on.value);
    var oc = document.getElementById('ocode');
    if (oc) S.ocode = oc.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
  }
  function makeOrder(n, count) {
    var o = [];
    while (o.length < n) {
      var b = []; for (var k = 0; k < count; k++) b.push(k);
      for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = b[i]; b[i] = b[j]; b[j] = x; }
      o = o.concat(b);
    }
    return o.slice(0, n);
  }
  function startLocal() {
    syncInputs();
    S.names = S.names.map(function (n, i) { n = cleanName(n); return n || defName(i); });
    savePref();
    S.mode = 'local';
    S.players = S.names.map(function (n) { return { name: n, score: 0 }; });
    S.order = makeOrder(S.rounds, cats().length);
    S.round = 0; S.turn = 0; S.answers = []; S.screen = 'pass';
    render();
  }
  function submit(skip) {
    var inp = document.getElementById('ans');
    if (!inp) return;
    stopTimer();
    var raw = skip === true ? '' : String(inp.value).slice(0, 40);
    if (S.mode === 'online') { onlineSubmit(raw); return; }
    if (S.screen !== 'input') return;
    S.answers.push({ raw: raw });
    fx('send');
    S.turn++;
    if (S.turn < S.players.length) { S.screen = 'pass'; }
    else {
      S.screen = 'reveal';
      var res = evalEntries(cats()[S.order[S.round]], localEntries());
      setTimeout(function () { fx(res.best > 0 ? 'win' : 'none'); }, 150);
    }
    render();
  }
  function nextLocal() {
    var res = evalEntries(cats()[S.order[S.round]], localEntries());
    res.rows.forEach(function (r, i) { if (r.win) S.players[i].score++; });
    S.round++;
    if (S.round >= S.rounds) { S.screen = 'final'; }
    else { S.answers = []; S.turn = 0; S.screen = 'pass'; }
    render();
  }

  /* ---------- Online akış ---------- */
  var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  function genCode() { var s = ''; for (var i = 0; i < 5; i++) s += CODE_CHARS.charAt(Math.floor(Math.random() * CODE_CHARS.length)); return s; }
  function unsubAll() {
    S.unsub.forEach(function (u) { try { u(); } catch (e) {} });
    S.unsub = []; clearTimeout(S.hostTo); S.hostTk = '';
  }
  function subscribe(code) {
    var base = 'rooms/' + code;
    var onErr = function () { S.msg = t('roomerr'); render(true); };
    S.unsub.push(S.db.doc(base).onSnapshot(function (sn) { S.room = sn.exists ? sn.data() : null; changed(); }, onErr));
    S.unsub.push(S.db.collection(base + '/players').onSnapshot(function (sn) {
      S.rp = sn.docs.map(function (d) { var x = d.data() || {}; return { id: d.id, name: cleanName(x.name) || '?', joined: Number(x.joined) || 0 }; })
        .sort(function (a, b) { return a.joined - b.joined || (a.id < b.id ? -1 : 1); });
      changed();
    }, onErr));
    S.unsub.push(S.db.collection(base + '/answers').onSnapshot(function (sn) {
      S.ra = sn.docs.map(function (d) { return d.data() || {}; });
      changed();
    }, onErr));
  }
  function enterOnline(code, lang) {
    S.mode = 'online'; S.code = code; S.lang = lang; S.room = null; S.rp = []; S.ra = []; S.sent = -1; S.lastKey = '';
    S.screen = 'online';
    unsubAll(); subscribe(code); render();
  }
  function okey() {
    var r = S.room;
    if (!r) return 'x';
    if (r.status === 'lobby') return 'lobby:' + S.rp.map(function (p) { return p.id + p.name; }).join(',') + ':' + (S.rp.length < 2);
    if (r.status === 'play') {
      var mine = !!findAns(r.round, S.uid) || S.sent === r.round;
      return mine ? 'wait:' + r.round + ':' + countAns(r.round) + ':' + S.rp.length : 'in:' + r.round;
    }
    if (r.status === 'reveal') return 'rev:' + r.round + ':' + JSON.stringify(r.ovr || {}) + ':' + countAns(r.round) + ':' + S.rp.length;
    return 'fin:' + S.rp.length + JSON.stringify(r.ovr || {});
  }
  function hostSet(patch) {
    if (S.busy) return;
    S.busy = true;
    S.db.doc('rooms/' + S.code).update(patch).catch(function () { S.msg = t('roomerr'); render(true); }).then(function () { S.busy = false; });
  }
  function hostTimer() {
    var r = S.room;
    if (!r.time) return;
    var k = r.round + ':' + r.t;
    if (S.hostTk === k) return;
    S.hostTk = k; clearTimeout(S.hostTo);
    S.hostTo = setTimeout(function () {
      if (S.room && S.room.status === 'play' && S.room.round === r.round && isHost()) hostSet({ status: 'reveal' });
    }, (r.time + 6) * 1000);
  }
  function changed() {
    if (S.screen !== 'online' || !S.room) return;
    var r = S.room;
    if (isHost() && r.status === 'play') {
      if (S.rp.length > 0 && countAns(r.round) >= S.rp.length) hostSet({ status: 'reveal' });
      hostTimer();
    }
    var k = okey();
    if (k !== S.lastKey) {
      var prev = S.lastKey.split(':')[0], cur = k.split(':')[0];
      S.lastKey = k;
      render(prev === cur);
      if (cur === 'rev' && prev !== 'rev') { var res = oEval(r.round); fx(res.best > 0 ? 'win' : 'none'); }
    }
  }
  function onlineSubmit(raw) {
    var r = S.room, round = r.round;
    if (S.sent === round) return;
    S.sent = round; fx('send');
    S.lastKey = okey(); render(true);
    S.db.doc('rooms/' + S.code + '/answers/r' + round + '_' + S.uid).set({ round: round, uid: S.uid, raw: raw, ts: Date.now() })
      .catch(function () { S.sent = -1; S.msg = t('roomerr'); S.lastKey = ''; changed(); });
  }
  function createRoom() {
    syncInputs();
    var name = cleanName(PREF.oname) || t('pl');
    PREF.oname = name; savePref();
    var tryMake = function (n) {
      if (n > 5) { S.msg = t('roomerr'); render(true); return Promise.resolve(); }
      var code = genCode();
      return S.db.doc('rooms/' + code).get().then(function (ex) {
        if (ex.exists) return tryMake(n + 1);
        return S.db.doc('rooms/' + code).set({ code: code, host: S.uid, lang: S.lang, rounds: S.rounds, time: S.time, status: 'lobby', round: 0, order: [], t: 0, ovr: {}, created: Date.now() })
          .then(function () { return S.db.doc('rooms/' + code + '/players/' + S.uid).set({ name: name, joined: Date.now() }); })
          .then(function () { enterOnline(code, S.lang); });
      });
    };
    tryMake(0).catch(function () { S.msg = t('roomerr'); render(true); });
  }
  function joinRoom() {
    syncInputs();
    var name = cleanName(PREF.oname) || t('pl');
    PREF.oname = name; savePref();
    var code = S.ocode;
    if (code.length !== 5) { S.msg = t('notfound'); render(true); return; }
    var room;
    S.db.doc('rooms/' + code).get().then(function (d) {
      if (!d.exists) { S.msg = t('notfound'); render(true); return; }
      room = d.data();
      return S.db.collection('rooms/' + code + '/players').get().then(function (ps) {
        var already = ps.docs.some(function (x) { return x.id === S.uid; });
        if (room.status !== 'lobby' && !already) { S.msg = t('started'); render(true); return; }
        if (!already && ps.size >= 6) { S.msg = t('full'); render(true); return; }
        var go = function () { enterOnline(code, LANGS.indexOf(room.lang) > -1 ? room.lang : 'en'); };
        if (already) { go(); return; }
        return S.db.doc('rooms/' + code + '/players/' + S.uid).set({ name: name, joined: Date.now() }).then(go);
      });
    }).catch(function () { S.msg = t('roomerr'); render(true); });
  }
  function leaveRoom() {
    unsubAll();
    S.room = null; S.rp = []; S.ra = []; S.code = ''; S.mode = 'local'; S.lang = PREF.lang; S.screen = 'home';
    render();
  }

  /* ---------- Olaylar ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (b.getAttribute('aria-disabled') === 'true') return;
    if (act !== 'music' && act !== 'fx') fx('tap');
    if (act !== 'submit' && act !== 'skip') syncInputs();
    if (act === 'music') { PREF.music = !PREF.music; savePref(); if (PREF.music) musicOn(); else musicOff(); syncHud(); }
    else if (act === 'fx') { PREF.fx = !PREF.fx; savePref(); syncHud(); }
    else if (act === 'local') { S.screen = 'setup'; render(); }
    else if (act === 'ocreate') { S.screen = 'ocreate'; render(); }
    else if (act === 'ojoin') { S.screen = 'ojoin'; render(); }
    else if (act === 'home') { S.screen = 'home'; render(); }
    else if (act === 'add') { if (S.names.length < 6) S.names.push(defName(S.names.length)); render(true); }
    else if (act === 'remove') { S.names.splice(+b.dataset.i, 1); render(true); }
    else if (act === 'rounds') { S.rounds = +b.dataset.v; savePref(); render(true); }
    else if (act === 'time') { S.time = +b.dataset.v; savePref(); render(true); }
    else if (act === 'start') startLocal();
    else if (act === 'ready') { S.screen = 'input'; render(); }
    else if (act === 'submit') submit(false);
    else if (act === 'skip') submit(true);
    else if (act === 'toggle') {
      var i = +b.dataset.u, res = evalEntries(cats()[S.order[S.round]], localEntries());
      S.answers[i].ovr = !res.rows[i].ok; render(true);
    }
    else if (act === 'next') nextLocal();
    else if (act === 'again') startLocal();
    else if (act === 'ocgo') createRoom();
    else if (act === 'ojgo') joinRoom();
    else if (act === 'ostart') { var r = S.room; hostSet({ status: 'play', round: 0, order: makeOrder(r.rounds, CAT[r.lang].length), t: Date.now() }); }
    else if (act === 'oforce') hostSet({ status: 'reveal' });
    else if (act === 'otoggle') {
      var rr = S.room, ev = oEval(rr.round), uid = b.dataset.u, row = ev.rows.filter(function (x) { return x.uid === uid; })[0];
      if (row) { var o = {}; o['r' + rr.round + '_' + uid] = !row.ok; hostSet({ ovr: o }); }
    }
    else if (act === 'onext') {
      var r2 = S.room;
      if (r2.round + 1 >= r2.rounds) hostSet({ status: 'final' }); else hostSet({ status: 'play', round: r2.round + 1, t: Date.now() });
    }
    else if (act === 'copy') {
      var done = function () { b.textContent = t('copied'); setTimeout(function () { b.textContent = t('copy'); }, 1500); };
      try { navigator.clipboard.writeText(S.code).then(done, function () {}); } catch (err) {}
    }
    else if (act === 'leave') leaveRoom();
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'lang') {
      syncInputs();
      var old = S.lang; S.lang = e.target.value;
      if (LANGS.indexOf(S.lang) < 0) S.lang = old;
      S.names = S.names.map(function (n, i) { return isDef(n) ? defName(i) : n; });
      savePref(); render(true);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); submit(false); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'ans') { var c = document.getElementById('cnt'); if (c) c.textContent = letters(e.target.value) + ' ' + t('letters'); }
    if (id === 'ocode') { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5); }
  });

  /* ---------- Başlangıç ---------- */
  function initDb() {
    if (!window.claude || !window.claude.use) { S.dbState = 'off'; return Promise.resolve(); }
    return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (a) {
      var db = a[0], user = a[1];
      if (!db || !user) { S.dbState = 'off'; return; }
      return user.id().then(function (id) {
        if (!id) { S.dbState = 'off'; return; }
        S.db = db; S.uid = id;
        return user.can('data.write').then(function (w) { S.dbState = w === false ? 'nowrite' : 'ready'; });
      });
    }).catch(function () { S.dbState = 'off'; });
  }
  loadPref();
  S.lang = PREF.lang; S.rounds = PREF.rounds; S.time = PREF.time;
  S.names = PREF.names || [defName(0), defName(1)];
  render();
  initDb().then(function () { if (S.screen === 'home') render(true); });
})();
</script>

</body></html>
